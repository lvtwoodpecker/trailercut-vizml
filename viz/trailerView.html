<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trailer View</title>

  <!-- Poppins Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --page: #f9f9f7;
      --surface: #fcfcfb;
      --ink: #0b0b0b;
      --ink-2: #52514e;
      --muted: #6f6d68;
      --grid: #e1e0d9;
      --axis: #c3c2b7;
      --border: rgba(11, 11, 11, 0.10);
      --matched: #2a78d6;
      --used: #eb6834;
      --unmatched: #d6d5ce;
      --speech: #1baf7a;
      --pos: #2a78d6;
      --neg: #e34948;
    }

    @media (prefers-color-scheme: dark) {
      :root:where(:not([data-theme="light"])) {
        color-scheme: dark;
        --page: #0d0d0d;
        --surface: #1a1a19;
        --ink: #f0efec;
        --ink-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --border: rgba(255, 255, 255, 0.10);
        --matched: #3987e5;
        --used: #d95926;
        --unmatched: #383835;
        --speech: #199e70;
        --pos: #3987e5;
        --neg: #e66767;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255, 255, 255, 0.10);
      --matched: #3987e5;
      --used: #d95926;
      --unmatched: #383835;
      --speech: #199e70;
      --pos: #3987e5;
      --neg: #e66767;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scrollbar-gutter: stable;
    }

    body {
      margin: 0;
      padding: 20px;
      background: var(--page);
      color: var(--ink);
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    button,
    input,
    select,
    svg text {
      font-family: inherit;
    }

    main {
      width: 100%;
      padding: 16px 20px 24px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 0 2px 14px 2px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .header-left h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--ink);
      white-space: nowrap;
    }

    .header-left .lede,
    .meta {
      margin: 0;
      color: var(--muted);
      font-size: 0.8125rem;
      font-weight: 400;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    header nav {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header nav a {
      color: var(--ink-2);
      font-size: 0.8125rem;
      font-weight: 500;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.15s ease;
    }

    header nav a:hover {
      color: var(--ink);
      text-decoration: underline;
    }

    input {
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 13px;
    }

    button {
      font-size: 13px;
      color: var(--ink);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 10px;
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--matched);
      outline-offset: 1px;
    }

    button[aria-pressed="false"] {
      opacity: 0.45;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 0;
    }

    .card h2 {
      font-size: 13px;
      font-weight: 600;
      margin: 0 0 6px;
      color: var(--ink-2);
    }

    /* Trailer and current film shot: equal-width columns */
    .stage {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 8px;
      width: 100%;
      align-items: stretch;
      margin-bottom: 8px;
    }

    .player b,
    #now .head {
      display: flex;
      align-items: center;
      min-height: 24px;
      margin: 0 0 8px;
      font-size: 14px;
    }

    #now .head .pos {
      margin-left: auto;
      font-size: 12px;
      color: var(--muted);
    }

    #vid,
    #now img,
    #now .empty {
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 4px;
    }

    #vid {
      position: relative;
      overflow: hidden;
    }

    #vid iframe {
      position: absolute;
      inset: 0;
      width: 100% !important;
      height: 100% !important;
    }

    .player .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      margin-top: 10px;
    }

    .player .controls button {
      flex-shrink: 0;
    }

    /* Current shot panel */
    #now {
      min-height: 100%;
    }

    #now .head {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      font-variant-numeric: tabular-nums;
    }

    #now .head b {
      font-size: 14px;
    }

    #now .tag {
      font-size: 12px;
      padding: 0 6px;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--ink-2);
      white-space: nowrap;
    }

    #now .body,
    #now .frames {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
    }

    #now .body {
      gap: 10px;
    }

    #now .frames {
      gap: 6px;
    }

    #now svg {
      max-width: 100%;
    }

    #now figure {
      margin: 0;
      min-width: 0;
    }

    #now img {
      display: block;
      object-fit: cover;
      background: var(--grid);
    }

    #now figcaption {
      font-size: 12px;
      color: var(--muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    #now .empty {
      border: 1px dashed var(--axis);
      display: grid;
      place-items: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* Model explanations */
    .why-h {
      font-size: 12px;
      color: var(--ink-2);
      margin: 0 0 4px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px;
      justify-content: space-between;
    }

    .shap-row {
      cursor: pointer;
    }

    .shap-row text {
      fill: var(--ink);
      font-size: 12px;
    }

    .shap-row .val {
      fill: var(--ink-2);
      font-variant-numeric: tabular-nums;
    }

    /* Timeline legend */
    .legend {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 18px;
      width: 100%;
      font-size: 12px;
      color: var(--ink-2);
      margin: 0 0 10px;
      padding: 0 0 10px;
      border-bottom: 1px solid var(--border);
    }

    .legend span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend i {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    /* Timeline and charts */
    svg {
      display: block;
      overflow: visible;
    }

    #main {
      touch-action: none;
      user-select: none;
    }

    .axis text {
      fill: var(--muted);
      font-size: 11px;
      font-variant-numeric: tabular-nums;
    }

    .axis path,
    .axis line {
      stroke: var(--axis);
    }

    .lbl {
      fill: var(--muted);
      font-size: 11px;
    }

    .link {
      stroke: var(--matched);
      stroke-opacity: 0.35;
      stroke-width: 1.2;
      fill: none;
    }

    .link.hi {
      stroke-opacity: 1;
      stroke-width: 3;
    }

    .slink {
      stroke: var(--speech);
      stroke-width: 2.5;
      stroke-dasharray: 5 3;
      fill: none;
    }

    .scrub {
      cursor: ew-resize;
    }

    .hit {
      cursor: pointer;
    }

    .outline {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.5;
      pointer-events: none;
    }

    #playhead {
      stroke: var(--ink);
      stroke-width: 2;
      pointer-events: none;
    }

    .dot {
      fill: var(--matched);
      stroke: var(--surface);
      stroke-width: 2;
      pointer-events: none;
    }

    .sdot {
      fill: var(--speech);
      stroke: var(--surface);
      stroke-width: 2;
      pointer-events: none;
    }

    .dot.cur,
    .sdot.cur {
      stroke: var(--ink);
      stroke-width: 2.5;
      r: 7;
    }

    .diag {
      stroke: var(--axis);
      stroke-dasharray: 4 4;
    }

    .note {
      color: var(--muted);
      font-size: 12px;
      margin: 4px 0 0;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-top: 8px;
    }

    /* Shots table */
    details#tbl {
      margin-top: 6px;
      font-size: 12px;
    }

    details#tbl summary {
      cursor: pointer;
      color: var(--ink-2);
    }

    .tbl-wrap {
      max-height: 260px;
      overflow: auto;
      margin-top: 6px;
      border-top: 1px solid var(--grid);
    }

    #tbl table {
      border-collapse: collapse;
      width: 100%;
      font-variant-numeric: tabular-nums;
    }

    #tbl th {
      position: sticky;
      top: 0;
      background: var(--surface);
      text-align: right;
      font-weight: 600;
      color: var(--ink-2);
      padding: 4px 8px;
      border-bottom: 1px solid var(--grid);
    }

    #tbl td {
      text-align: right;
      padding: 3px 8px;
      border-bottom: 1px solid var(--grid);
      color: var(--ink);
    }

    #tbl tbody tr {
      cursor: pointer;
    }

    #tbl tbody tr:hover {
      background: var(--grid);
    }

    #tbl tr.cur td {
      background: var(--grid);
      font-weight: 600;
    }

    /* Tooltip */
    #tip {
      position: fixed;
      pointer-events: none;
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      display: none;
      max-width: 380px;
      z-index: 10;
    }

    #tip .pair {
      display: flex;
      gap: 4px;
      margin-bottom: 4px;
    }

    #tip img {
      width: 180px;
      border-radius: 4px;
      display: block;
    }

    /* Search dropdown */
    .search-wrap {
      position: relative;
      flex: 0 0 240px;
      width: 240px;
    }

    #search {
      width: 100%;
    }

    .search-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      right: 0;
      max-height: 320px;
      overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
      z-index: 1000;
    }

    .search-dropdown.open {
      display: block;
    }

    .search-item {
      padding: 8px 12px;
      font-size: 13px;
      color: var(--ink-2);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .search-item:hover,
    .search-item.active {
      background: var(--grid);
      color: var(--ink);
    }

    /* Loading overlay */
    .film-loader {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      height: 36px;
      margin-bottom: 12px;
    }

    .film-frame {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--matched);
      animation: dotBounce 0.9s ease-in-out infinite;
    }

    .film-frame:nth-child(2) {
      animation-delay: 0.12s;
    }

    .film-frame:nth-child(3) {
      animation-delay: 0.24s;
    }

    .film-frame:nth-child(4) {
      background: var(--matched);
      animation-delay: 0.36s;
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      40% {
        transform: translateY(-9px);
        opacity: 1;
      }
    }

    #loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(13, 13, 13, 0.82);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--ink);
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #loading-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .loading-note {
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
    }

    #retry-loading {
      margin-top: 20px;
      padding: 9px 20px;
      background: var(--ink);
      color: var(--page);
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Responsive layout */
    @media (max-width: 999px) {
      .stage {
        grid-template-columns: minmax(0, 1fr);
      }

      #now {
        height: fit-content;
        max-height: 500px;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <div class="header-left">
        <h1 id="title">Trailer View</h1>
        <p class="lede" id="meta"></p>
      </div>
      <nav>
        <div class="search-wrap">
          <input id="search" name="film-filter" type="text" placeholder="Search a film..." autocomplete="off"
            aria-label="Search a film" spellcheck="false" />
          <div id="search-results" class="search-dropdown"></div>
        </div>
        <a href="/viz/trailerScope.html">← TrailerScope</a>
      </nav>
    </header>

    <div class="stage">
      <section class="card player">
        <b>Trailer</b>
        <div id="vid"></div>
        <script src="https://www.youtube.com/iframe_api"></script>
        <div class="controls">
          <button id="prev" aria-label="Previous shot">⏮</button>
          <button id="pp" aria-label="Play">▶</button>
          <button id="next" aria-label="Next shot">⏭</button>
          <span id="clock">0:00</span>
          <span style="flex:1"></span>
          <button id="cc" aria-pressed="true" aria-label="Captions">CC</button>
          <button id="mute" aria-pressed="true" aria-label="Sound">♪</button>
        </div>
      </section>
      <section class="card" id="now" aria-live="polite"></section>
    </div>

    <section class="card">
      <div class="legend">
        <span><i style="background:var(--matched)"></i>matched</span>
        <span><i style="border:1px solid var(--axis)"></i>no match</span>
        <span><i style="background:var(--used)"></i>used in trailer</span>
        <span><i style="background:var(--speech)"></i>dialogue from the film</span>
      </div>
      <div id="main-wrap"><svg id="main" role="img"
          aria-label="Trailer shots linked to where they come from in the film"></svg></div>
      <details id="tbl">
        <summary>Shots table</summary>
        <div class="tbl-wrap">
          <table>
            <thead>
              <tr>
                <th>shot</th>
                <th>start</th>
                <th>end</th>
                <th>match</th>
                <th>film shot</th>
                <th>film position</th>
                <th>score</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </details>
    </section>

    <div class="grid2">
      <section class="card">
        <h2>Trailer order vs film order</h2><svg id="order"></svg>
      </section>
      <section class="card">
        <h2>Sound vs picture</h2><svg id="sync"></svg>
        <p class="note" id="sync-note"></p>
      </section>
    </div>
  </main>
  <!-- On-demand trailer preparation overlay -->
  <div id="loading-overlay" aria-live="polite">
    <div class="loading-content">
      <div class="film-loader" aria-hidden="true">
        <div class="film-frame"></div>
        <div class="film-frame"></div>
        <div class="film-frame"></div>
        <div class="film-frame"></div>
      </div>

      <h2>Preparing your film</h2>

      <p id="loading-message">
        Initializing...
      </p>

      <p class="loading-note">
        This may take a few minutes. Please wait.
      </p>

      <button id="retry-loading" hidden onclick="load(new URLSearchParams(location.search).get('id'))">
        Try again
      </button>
    </div>
  </div>
  <div id="tip"></div>

  <script src="trailerView.js"></script>
</body>

</html>
