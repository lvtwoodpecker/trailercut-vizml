<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TrailerScope - Trailer Archetypes</title>

    <!-- Poppins Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            color-scheme: light;
            --page: #f9f9f7;
            --surface: #fcfcfb;
            --ink: #0b0b0b;
            --ink-2: #52514e;
            --muted: #6f6d68;
            --grid: #e1e0d9;
            --axis: #c3c2b7;
            --border: rgba(11, 11, 11, 0.10);
            --matched: #2a78d6;
            --used: #d95926;
            --unmatched: #c3c2b7;
            --speech: #199e70;
            --pos: #2a78d6;
            --neg: #e34948;
        }

        @media (prefers-color-scheme: dark) {
            :root:where(:not([data-theme="light"])) {
                color-scheme: dark;
                --page: #0d0d0d;
                --surface: #1a1a19;
                --ink: #f0efec;
                --ink-2: #c3c2b7;
                --muted: #898781;
                --grid: #2c2c2a;
                --axis: #383835;
                --border: rgba(255, 255, 255, 0.10);
                --matched: #3987e5;
                --used: #d95926;
                --unmatched: #383835;
                --speech: #199e70;
                --pos: #3987e5;
                --neg: #e66767;
            }
        }

        :root[data-theme="dark"] {
            color-scheme: dark;
            --page: #0d0d0d;
            --surface: #1a1a19;
            --ink: #f0efec;
            --ink-2: #c3c2b7;
            --muted: #898781;
            --grid: #2c2c2a;
            --axis: #383835;
            --border: rgba(255, 255, 255, 0.10);
            --matched: #3987e5;
            --used: #d95926;
            --unmatched: #383835;
            --speech: #199e70;
            --pos: #3987e5;
            --neg: #e66767;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scrollbar-gutter: stable;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            background: var(--page);
            color: var(--ink);
        }

        main {
            width: 100%;
            padding: 16px 20px 24px;
        }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 0 2px 14px 2px;
            margin-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }

        .header-left h1 {
            margin: 0;
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--ink);
            white-space: nowrap;
        }

        .header-left .lede {
            margin: 0;
            font-size: 0.8125rem;
            color: var(--muted);
            font-weight: 400;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        header nav {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        header nav a {
            color: var(--ink-2);
            font-size: 0.8125rem;
            font-weight: 500;
            text-decoration: none;
            white-space: nowrap;
            transition: color 0.15s ease;
        }

        header nav a:hover {
            color: var(--ink);
            text-decoration: underline;
        }

        /* Full-width controls bar */
        #controls {
            display: flex;
            gap: 16px;
            margin-bottom: 8px;
            align-items: center;
            flex-wrap: wrap;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            font-weight: 600;
        }

        select,
        input,
        button {
            font-family: inherit;
            background: var(--page);
            color: var(--ink);
            border: 1px solid var(--border);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            outline: none;
        }

        select:focus,
        input:focus {
            border-color: var(--matched);
        }

        /* Main Workspace */
        .workspace {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 450px;
            grid-template-rows: auto auto;
            gap: 8px;
            align-items: stretch;
        }

        #viz-container,
        .right-panel {
            display: contents;
        }

        /* Modality Documentation Box */
        .info-box {
            grid-column: 1 / -1;
            grid-row: 1;
            background: var(--surface);
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .info-box h3 {
            margin: 0 0 4px 0;
            font-size: 0.875rem;
            color: var(--ink);
            font-weight: 600;
        }

        .info-box p {
            margin: 0;
            font-size: 0.8125rem;
            line-height: 1.4;
            color: var(--muted);
        }

        .legend-items {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 14px;
            margin-top: 10px;
        }

        .legend-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8125rem;
            color: var(--ink-2);
            cursor: pointer;
            padding: 2px 0;
            border-radius: 4px;
            transition: background-color 0.15s ease, opacity 0.15s ease;
        }

        .legend-item:hover {
            background: var(--page);
        }

        .legend-item.dimmed {
            opacity: 0.4;
        }

        .legend-item.active {
            background: var(--page);
            font-weight: 600;
            color: var(--ink);
        }

        .legend-color {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        #reset-zoom-btn {
            transition: background-color 0.15s ease, opacity 0.15s ease;
            cursor: pointer;
        }

        #reset-zoom-btn:hover {
            background: var(--unmatched);
        }

        /* Scatterplot Card */
        .svg-wrapper {
            grid-column: 1;
            grid-row: 2;
            position: relative;
            width: 100%;
            min-height: 540px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 540px;
            display: block;
        }

        .grid line {
            stroke: var(--grid);
            stroke-dasharray: 2, 3;
        }

        .axis path,
        .axis line {
            stroke: var(--axis);
        }

        .axis text {
            fill: var(--muted);
            font-size: 11px;
            font-family: inherit;
        }

        .axis-label {
            fill: var(--ink-2);
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .dot {
            stroke: var(--page);
            stroke-width: 0.75px;
            cursor: pointer;
        }

        /* Hover Tooltip */
        .tooltip {
            position: absolute;
            padding: 8px 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            pointer-events: none;
            font-size: 0.8125rem;
            color: var(--ink);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
            opacity: 0;
            transition: opacity 0.12s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .detail-drawer {
            display: flex;
            flex-direction: column;
            grid-column: 2;
            grid-row: 2;
            align-self: start;
            min-height: 0;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 18px;
            border-radius: 8px;
        }

        .detail-content {
            flex: 1;
            min-height: 0;
            overflow-y: auto;
        }

        .workspace.drawer-open .info-box {
            grid-column: 1;
            grid-row: 1;
        }

        .workspace.drawer-open #detail-title {
            font-size: 1.05rem;
            color: var(--ink);
        }

        .workspace.drawer-open .detail-drawer {
            grid-row: 1 / -1;
            align-self: stretch;
        }

        #detail-title {
            margin: 0;
            font-size: 0.875rem;
            flex: 1;
            font-weight: 600;
            color: var(--muted);
        }

        .workspace:has(#detail-clusters:not(:empty)) #detail-title {
            font-size: 1.05rem;
            color: var(--ink);
        }

        .imdb-link {
            padding: 4px 10px;
            background: #f5c518;
            color: #000000;
            font-weight: 700;
            font-size: 0.75rem;
            border-radius: 6px;
            text-decoration: none;
        }

        .trailer-link {
            display: block;
            padding: 8px 12px;
            background: var(--matched);
            color: #ffffff;
            font-weight: 600;
            font-size: 0.8125rem;
            text-align: center;
            border-radius: 6px;
            text-decoration: none;
            margin-top: 10px;
            transition: opacity 0.15s ease;
        }

        .trailer-link:hover {
            opacity: 0.9;
        }

        .cluster-tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--grid);
            color: var(--ink-2);
            margin-top: 6px;
            margin-right: 6px;
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div class="header-left">
                <h1>TrailerScope</h1>
                <p class="lede">Multi-Modal Archetype Exploration &amp; Feature Analysis</p>
            </div>
            <nav>
                <a href="/">← Feature Findings</a>
            </nav>
        </header>

        <div id="controls">
            <div class="control-group">
                <label for="modality-select">Modality Space</label>
                <select id="modality-select">
                    <option value="all">Overall Composite (All)</option>
                    <option value="pacing">Pacing &amp; Edit Velocity</option>
                    <option value="audio">Audio &amp; Dynamic Range</option>
                    <option value="story">Story &amp; Narrative Alignment</option>
                    <option value="dialogue">Dialogue &amp; Subtitles</option>
                    <option value="visual">Visual Concept Scaling</option>
                    <option value="speech">Speech Synchronization</option>
                </select>
            </div>

            <div class="control-group">
                <label for="space-select">Space Projection</label>
                <select id="space-select">
                    <option value="res">Residualized (Bias Purged)</option>
                    <option value="base">Baseline (Raw Features)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="color-by-select">Color By</label>
                <select id="color-by-select">
                    <option value="cluster">Archetype Cluster</option>
                    <option value="genre">Primary Genre</option>
                    <option value="decade">Decade</option>
                </select>
            </div>

            <div class="control-group">
                <label for="genre-select">Filter Genre</label>
                <select id="genre-select">
                    <option value="all">All Genres</option>
                </select>
            </div>

            <div class="control-group">
                <label for="search-input">Search Title</label>
                <input type="text" id="search-input" placeholder="Search movie title...">
            </div>

            <div class="control-group" style="margin-left: auto;">
                <label>&nbsp;</label>
                <button id="reset-zoom-btn" type="button">Reset View</button>
            </div>
        </div>

        <div class="workspace">
            <div id="viz-container">
                <div class="info-box">
                    <h3 id="info-heading">Overall Composite (All)</h3>
                    <p id="info-description">
                        Combines all extracted features into a single UMAP projection to group trailers by overall
                        structural marketing archetype.
                    </p>
                    <div id="legend-items" class="legend-items"></div>
                    <div id="cluster-profile" style="margin-top: 12px; font-size: 0.8125rem; color: var(--ink-2);">
                    </div>
                </div>
            </div>
            <div class="svg-wrapper">
                <svg id="scatterplot"></svg>
                <div id="tooltip" class="tooltip"></div>
            </div>

            <div class="right-panel">
                <div id="detail-drawer" class="detail-drawer">
                    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
                        <h2 id="detail-title">Select a trailer to begin...</h2>
                        <a id="imdb-link" href="#" target="_blank" rel="noopener noreferrer" class="imdb-link"
                            style="display: none;">
                            IMDb ↗
                        </a>
                    </div>

                    <p id="detail-meta" style="color: var(--muted); font-size: 0.8125rem; margin: 4px 0 0 0;"></p>

                    <div id="detail-content" class="detail-content">
                        <div id="detail-clusters" style="margin-top: 12px;"></div>
                        <a id="trailer-view-link" class="trailer-link" href="#" style="display: none;">
                            Open TrailerView →
                        </a>

                        <div id="trailer-player-container" style="margin-top: 16px; display: none;">
                            <iframe id="trailer-player" width="100%" height="180" src="" title="YouTube video player"
                                frameborder="0"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                                allowfullscreen style="border-radius: 6px; border: 1px solid var(--border);">
                            </iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="trailerScope.js"></script>
</body>

</html>
